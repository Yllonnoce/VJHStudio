[project]
name = "vjhstudio"
dynamic = ["version"]
description = "Local image and video generation studio for RunWare.AI"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "httpx>=0.27",
  "runware-sdk>=1.6,<2",
  "pillow>=10",
  "python-slugify>=8",
]

[project.scripts]
vjhstudio = "vjhstudio.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "vjhstudio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["vjhstudio"]
artifacts = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ", "S"]
# E501: the plan prescribes a compact style; S101: assert is the point in tests;
# EXE002: the NTFS working mount reports every file as 0755.
ignore = ["E501", "S101", "EXE002"]
per-file-ignores = {"tests/*" = ["S", "DTZ"], "migrations/*" = ["I", "E402"]}
