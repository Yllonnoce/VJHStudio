{% from "partials/_boost.html" import boost %}
<li id="jobs-badge" {% if oob %}hx-swap-oob="true"{% endif %}
    hx-get="/hx/jobs/badge?at={{ current_path|default('/', true)|urlencode }}" hx-trigger="every 10s, jobs-changed from:body" hx-swap="outerHTML">
  {% if active_jobs or unseen_jobs %}
    <a href="/queue" class="chip {% if active_jobs %}busy{% endif %}" data-navlink {{ boost() }}{% if current_path is defined and current_path.startswith('/queue') %} aria-current="page"{% endif %}
       title="{{ active_jobs }} in flight, {{ unseen_jobs }} finished unseen">
      {%- if active_jobs %}{{ active_jobs }} running{% endif -%}
      {%- if active_jobs and unseen_jobs %} &middot; {% endif -%}
      {%- if unseen_jobs %}{{ unseen_jobs }} done{% endif -%}
    </a>
  {% else %}<a href="/queue" class="chip" title="Job queue" data-navlink {{ boost() }}{% if current_path is defined and current_path.startswith('/queue') %} aria-current="page"{% endif %}>Queue</a>{% endif %}
</li>
