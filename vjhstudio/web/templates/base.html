<!doctype html>
<html lang="en" data-theme="{{ theme }}" data-server-theme="{{ theme }}" data-scheme="{{ 'dark' if theme in dark_themes else 'light' }}" data-notify="{{ '1' if notify_desktop else '0' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VJHStudio{% endblock %}</title>
  <link rel="icon" href="/static/img/favicon.svg">
  <!-- 422 re-renders a partial with inline errors; htmx 2.x discards 4xx bodies by default. -->
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true,"error":false},{"code":"[45]..","swap":false,"error":true}]}'>
  <link rel="stylesheet" href="/static/css/themes.css">
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>try{var t=localStorage.getItem('vjh-theme');if(t){document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-scheme',{{ dark_themes|tojson }}.indexOf(t)>=0?'dark':'light');}}catch(e){}</script>
  <script src="/static/js/theme.js" defer></script>
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/js/compose.js" defer></script>
  <script src="/static/js/app.js" defer></script>
  <script src="/static/vendor/alpine-focus.min.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
</head>
<body hx-boost="false">
  {% include "_header.html" %}
  <main class="container">{% block content %}{% endblock %}</main>
  <div id="toasts" role="status" aria-live="polite"></div>
  <footer class="container"><small>VJHStudio v{{ app_version }}{% if commit_short %} · {{ commit_short }}{% endif %}</small></footer>
</body>
</html>
