<tr id="model-{{ m.id }}" class="{% if m.is_hidden %}hidden-model{% endif %}">
  <td><strong>{{ m.name }}</strong><br><small><code>{{ m.air }}</code>{% if m.creator %} · {{ m.creator }}{% endif %}</small>
    {% if m.dims_mode in ('list', 'rule') %}<small class="chip">sizes known</small>{% endif %}
    {% if m.badge %}<small class="chip warn">{{ m.badge }}</small>{% endif %}</td>
  <td title="{{ m.label }}">{{ m.label.split(' — ', 1)[1] if ' — ' in m.label else '' }}</td>
  <td>{{ m.family }}</td>
  <td>{{ m.source }}</td>
  <td>
    <button class="secondary outline btn-sm" hx-post="/models/{{ m.id }}/favourite" hx-target="#model-{{ m.id }}" hx-swap="outerHTML" title="Favourite">{{ '★' if m.is_favourite else '☆' }}</button>
    <button class="secondary outline btn-sm" hx-post="/models/{{ m.id }}/hide" hx-target="#model-{{ m.id }}" hx-swap="outerHTML" title="Hide/show">{{ 'Show' if m.is_hidden else 'Hide' }}</button>
  </td>
</tr>
