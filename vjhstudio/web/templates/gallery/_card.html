<article class="gallery-card" id="output-{{ o.id }}">
  <button type="button" class="gallery-thumb" hx-get="/hx/outputs/{{ o.id }}" hx-target="#lightbox-body"
          onclick="vjhOpenLightbox()" aria-label="Open {{ o.filename }}">
    {% if thumb %}<img src="{{ thumb }}" alt="{{ o.prompt_text|truncate(60) }}" loading="lazy" width="200" height="200">
    {% else %}<span class="chip">{{ o.filename }}</span>{% endif %}
    {% if o.is_favourite %}<span class="gallery-fav" aria-label="Favourite">★</span>{% endif %}
  </button>
  <footer class="gallery-card-meta">
    <small class="muted">{{ o.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
    {% if o.cost %}<small class="cost">${{ '%.4f'|format(o.cost) }}</small>{% endif %}
  </footer>
</article>
