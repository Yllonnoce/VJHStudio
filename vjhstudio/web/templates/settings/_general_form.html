<form id="general-form" hx-post="/settings" hx-swap="outerHTML" hx-target="this">
  {% for key, sp in spec.items() %}
    <label>{{ key }}
      {% if sp.choices %}
        <select name="{{ key }}">{% for c in sp.choices %}<option value="{{ c }}" {% if values[key] == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select>
      {% elif sp.type.__name__ == 'bool' %}
        {# the hidden field carries the "off" a cleared checkbox never posts #}
        <input type="hidden" name="{{ key }}" value="off">
        <input type="checkbox" name="{{ key }}" value="on" {% if values[key] %}checked{% endif %}>
      {% elif key in ("defaults.image_model", "defaults.video_model", "defaults.polish_model") %}
        {% set kind = {"defaults.image_model": "image", "defaults.video_model": "video", "defaults.polish_model": "text"}[key] %}
        {% with name=key, options=model_options[kind], selected=values[key], allow_empty=(key == "defaults.polish_model") %}{% include "catalog/_model_select.html" %}{% endwith %}
      {% else %}
        <input name="{{ key }}" value="{{ values[key] }}" {% if sp.type.__name__ == 'int' %}type="number"{% endif %}>
      {% endif %}
    </label>
  {% endfor %}
  <button type="submit">Save</button>
  {% if saved %}<p class="ok">Saved.</p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
</form>
