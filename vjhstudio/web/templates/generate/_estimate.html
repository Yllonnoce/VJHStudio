<span id="estimate" class="estimate"
      hx-get="/hx/generate/estimate" hx-trigger="change from:#generate-form delay:400ms"
      hx-include="#generate-form" hx-swap="outerHTML">
  {% if total is not none %}Estimated cost: <strong>≈${{ '%.4f'|format(total) }}</strong>
    <small class="muted">({{ width }}×{{ height }} × {{ number_results }})</small>
  {% else %}Estimated cost: <strong>n/a</strong> <small class="muted">(no price for this model)</small>{% endif %}
</span>
